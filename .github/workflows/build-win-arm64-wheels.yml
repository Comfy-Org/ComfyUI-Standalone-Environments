name: Build Windows ARM64 OpenCV

# Build public sources; NVIDIA's evaluation archive is not redistributable.
# Rust dependencies now have native PyPI wheels. Historical v1 assets remain
# available for older environment definitions that still reference them.
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-win-arm64-wheels.yml
      - .github/workflows/build-standalone-env.yml
      - requirements-nvidia-arm64.txt
      - scripts/build_opencv_arm64.py
      - scripts/smoke_win_arm64.py

permissions:
  contents: read

jobs:
  opencv:
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: arm64
      - name: Build OpenCV from pinned public sources
        run: python scripts/build_opencv_arm64.py --work-dir build/opencv
      - name: Install native wheels into a clean test environment
        shell: pwsh
        run: |
          python -m venv build/smoke
          $wheel = Get-ChildItem build/opencv/wheels/*.whl
          & build/smoke/Scripts/python.exe -m pip install --only-binary=:all: $wheel.FullName blake3==1.0.11 kornia-rs==0.1.15
          if ($LASTEXITCODE -ne 0) { throw "Native dependency install failed" }
      - name: Verify ARM64 imports, hashing and image round-trip
        run: build/smoke/Scripts/python.exe scripts/smoke_win_arm64.py
      - uses: actions/upload-artifact@v7
        with:
          name: opencv-python-win-arm64
          path: build/opencv/wheels/*.whl
          if-no-files-found: error
